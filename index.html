<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>まいまいスカイランド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- 復帰時フェード演出 -->
    <div id="respawn-flash" class="respawn-flash"></div>

    <!-- インゲームHUD -->
    <div id="hud" class="hud hidden">
      <!-- タッチ＆マウス操作用の透明エリア（左下：ジョイスティック / その他全体：カメラ） -->
      <div id="left-touch-zone" class="touch-zone left-zone"></div>
      <div id="right-touch-zone" class="touch-zone right-zone"></div>

      <!-- フローティングジョイスティック表示 -->
      <div id="joystick-base" class="joystick-base hidden">
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>

      <!-- ハートちゃんふれあいテキストウィンドウ -->
      <div id="dialogue-box" class="dialogue-box hidden" aria-live="polite">
        <div class="dialogue-inner">
          <div class="dialogue-avatar" aria-hidden="true">
            <svg viewBox="0 0 48 44" width="38" height="35">
              <path d="M24 38C10 28.5 4 21 4 13.5C4 7.5 8.8 3.5 14.2 3.5C18.2 3.5 21.8 5.8 24 9.5C26.2 5.8 29.8 3.5 33.8 3.5C39.2 3.5 44 7.5 44 13.5C44 21 38 28.5 24 38Z" fill="#f4538a" stroke="#450b20" stroke-width="3" stroke-linejoin="round"/>
              <ellipse cx="14" cy="11" rx="4.5" ry="2.3" transform="rotate(-20 14 11)" fill="#ffc6e0" opacity="0.7"/>
              <circle cx="18" cy="18" r="2.3" fill="#3b0c1b"/>
              <circle cx="30" cy="18" r="2.3" fill="#3b0c1b"/>
              <circle cx="17.2" cy="17.2" r="0.8" fill="#ffffff"/>
              <circle cx="29.2" cy="17.2" r="0.8" fill="#ffffff"/>
              <path d="M19 23.5Q24 25 29 23.5Q27.5 29.5 24 29.5Q20.5 29.5 19 23.5Z" fill="#d93829" stroke="#3b0c1b" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="dialogue-content">
            <div class="dialogue-speaker">ハートちゃん</div>
            <div id="dialogue-text" class="dialogue-text">あ、まいまい！遊びに来てくれたの？</div>
          </div>
        </div>
      </div>

      <!-- 右上：設定ボタン -->
      <button id="btn-settings" class="btn-circle btn-settings" aria-label="設定">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>

      <!-- 右下：ジャンプボタン -->
      <button id="btn-jump" class="btn-jump" aria-label="ジャンプ">
        <svg class="jump-icon" viewBox="0 0 36 36" width="34" height="34" fill="none">
          <path d="M18 6L10 15H15V22H21V15H26L18 6Z" fill="currentColor"/>
          <path d="M11 26.5C13 24.5 15.4 23.8 18 23.8C20.6 23.8 23 24.5 25 26.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M13.5 30.5C15 29.2 16.4 28.8 18 28.8C19.6 28.8 21 29.2 22.5 30.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
        </svg>
        <span class="jump-label">JUMP</span>
      </button>
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen" class="overlay-screen">
      <div class="title-card">
        <div class="card-inner-frame">
          <div class="title-emblem" aria-hidden="true">
            <svg viewBox="0 0 120 44" width="110" height="40">
              <path d="M26 32c-5.5 0-10-4.2-10-9.4 0-4.6 3.5-8.5 8-9.2C25.5 8.1 30.3 4.5 36 4.5c5.2 0 9.6 3.1 11.4 7.6 1.1-.4 2.3-.6 3.6-.6 5 0 9 3.8 9 8.6 0 6.5-5.3 11.9-12 11.9H26z" fill="#ffffff" stroke="#e9d8e4" stroke-width="2"/>
              <path d="M94 34c-4.4 0-8-3.4-8-7.6 0-3.7 2.8-6.8 6.4-7.4 1.2-4.2 5-7.2 9.6-7.2 4.2 0 7.7 2.5 9.1 6.1.9-.3 1.9-.5 2.9-.5 4 0 7.2 3.1 7.2 6.9 0 5.3-4.2 9.7-9.6 9.7H94z" fill="#ffffff" stroke="#e9d8e4" stroke-width="2" transform="translate(-8, -2) scale(0.92)"/>
              <path d="M60 15c-2.5-4.4-9-4.5-11.5-.3-2.2 3.7-.3 8.8 11.5 16.8 11.8-8 13.7-13.1 11.5-16.8C69 10.5 62.5 10.6 60 15z" fill="#ff75a0" stroke="#c93a6b" stroke-width="2"/>
              <circle cx="42" cy="10" r="2" fill="#f3c567"/>
              <circle cx="78" cy="11" r="2.2" fill="#f3c567"/>
              <path d="M60 3l1.2 3.2L64.5 7.5l-3.3 1.2L60 12l-1.2-3.3L55.5 7.5l3.3-1.3z" fill="#f3c567"/>
            </svg>
          </div>

          <div class="title-subtitle">MAIMAI SKYLAND</div>
          <h1 class="game-title">
            <span class="title-aka">まいまい</span>
            <span class="title-sky">スカイランド</span>
          </h1>
          <p class="title-desc">
            雲から雲へ、ぽよんと軽やかに大冒険。<br>
            やさしい空の世界を自由におさんぽしよう。
          </p>

          <div class="controls-guide">
            <div class="guide-item">
              <span class="guide-badge guide-move">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                  <circle cx="12" cy="12" r="7"/>
                  <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
                </svg>
              </span>
              <span class="guide-text">左下ドラッグ / WASDで転がる</span>
            </div>
            <div class="guide-item">
              <span class="guide-badge guide-jump">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5"/>
                  <path d="M6 11l6-6 6 6"/>
                </svg>
              </span>
              <span class="guide-text">JUMP / Spaceで2段ジャンプ</span>
            </div>
            <div class="guide-item">
              <span class="guide-badge guide-cam">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
              </span>
              <span class="guide-text">画面ドラッグでカメラ視点</span>
            </div>
          </div>

          <button id="btn-start" class="btn-primary btn-start">
            <span>冒険をはじめる</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="overlay-screen hidden">
      <div class="modal-card">
        <div class="card-inner-frame">
          <h2 class="modal-title">せってい</h2>

          <div class="setting-list">
            <button id="btn-toggle-sound" class="btn-setting-item">
              <span class="setting-left">
                <span class="setting-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                  </svg>
                </span>
                <span class="setting-label">サウンド</span>
              </span>
              <span id="sound-status" class="setting-badge on">ON</span>
            </button>

            <button id="btn-toggle-fullscreen" class="btn-setting-item">
              <span class="setting-left">
                <span class="setting-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                  </svg>
                </span>
                <span class="setting-label">全画面表示</span>
              </span>
              <span id="fullscreen-status" class="setting-badge">OFF</span>
            </button>

            <button id="btn-back-title" class="btn-setting-item btn-danger">
              <span class="setting-left">
                <span class="setting-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                  </svg>
                </span>
                <span class="setting-label">タイトルにもどる</span>
              </span>
            </button>
          </div>

          <button id="btn-close-settings" class="btn-primary btn-close">
            <span>もどる</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/player.js"></script>
  <script src="js/world.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
